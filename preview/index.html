<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Sheep — homepage preview (not live)</title>
<style>
@font-face{font-family:'Plex';font-style:normal;font-weight:400;font-display:block;
  src:url('../fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'Plex';font-style:normal;font-weight:500;font-display:block;
  src:url('../fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2');}

:root{
  --paper:#f1f0ec;
  --ink:#101010;
  --blue:#1f1fe0;
  --rule:rgba(16,16,16,.13);
  --gut:18px;
  --marg:24px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--paper)}
body{
  font-family:'Plex',ui-monospace,monospace;
  font-size:12px;line-height:15px;font-weight:400;
  color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased;
  padding:0 var(--marg);
}
a{color:inherit;text-decoration:none}

header{
  position:fixed;top:0;left:0;right:0;z-index:60;
  display:flex;justify-content:space-between;align-items:baseline;
  padding:var(--marg) var(--marg) 14px;
  background:linear-gradient(var(--paper) 58%,rgba(241,240,236,0));
  text-transform:uppercase;letter-spacing:.05em;
}
.brand{font-weight:500}
.brand:hover i{opacity:.5}
.brand i{font-style:normal;color:var(--blue)}
nav{display:flex;gap:26px}
nav a{position:relative}
nav a:hover{color:var(--blue)}
nav a::before{content:attr(data-tc);position:absolute;top:-14px;left:0;
  color:var(--blue);opacity:.4;letter-spacing:0;font-size:12px}

/* margin, not padding — absolutely-positioned children ignore padding-top */
#canvas{position:relative;margin-top:104px}
.item{position:absolute}

.tc{color:var(--blue);letter-spacing:0;font-variant-numeric:tabular-nums;
  opacity:.5;user-select:none;padding-bottom:8px;white-space:nowrap}
.tc::before{content:'';display:inline-block;width:6px;height:1px;background:var(--blue);
  vertical-align:4px;margin-right:6px;opacity:.75}

.film figure{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;
  background:#dcdad5;outline:1px solid var(--rule)}
.film img{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform 1.2s cubic-bezier(.16,1,.3,1),filter .45s ease}
.film:hover img{transform:scale(1.02)}
.film figcaption{display:flex;justify-content:space-between;gap:var(--gut);padding-top:8px}
.film .t{font-weight:500}
.film .c{color:var(--blue);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.film:hover .t{color:var(--blue)}
.film .idx{position:absolute;top:7px;left:8px;z-index:2;color:#fff;
  mix-blend-mode:difference;letter-spacing:.07em}

.blk .lbl{text-transform:uppercase;letter-spacing:.07em;color:var(--blue);padding-bottom:12px}
.blk p + p{padding-top:12px}

footer{
  position:relative;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:var(--gut);
  border-top:1px solid var(--rule);
  margin-top:44px;padding:14px 0 var(--marg);
  text-transform:uppercase;letter-spacing:.05em;
}
footer .muted{opacity:.4}

@media (max-width:860px){
  #canvas{margin-top:88px}
  .item{position:static !important;width:auto !important;margin-bottom:46px}
}
</style>
</head>
<body>

<header>
  <a class="brand" href="../index.html">Blue<i>·</i>Sheep</a>
  <nav>
    <a href="../work.html" data-tc="01">Work</a>
    <a href="../about.html" data-tc="02">Studio</a>
    <a href="../contact.html" data-tc="03">Contact</a>
  </nav>
</header>

<div id="canvas"></div>
<footer>
  <span>Blue Sheep — Toronto</span>
  <span class="muted">Documentary · Narrative · Commercial</span>
  <span class="muted">© 2026</span>
</footer>

<script>
const BASE = '../';
const FILMS = [
 {
  "slug": "jafsf",
  "title": "Just Another F*cking Short Film",
  "cat": "Narrative Short",
  "year": 2024,
  "still": "https://i.vimeocdn.com/video/2178587680-5b5faae4671957e899dfe616524921a36237f07f383f7c510ecb7789017f548f-d_1280?f=webp&region=us",
  "synopsis": "A wry, self-aware short about making films with no budget and too much heart.",
  "pull": "The title is the argument."
 },
 {
  "slug": "statuette",
  "title": "Statuette",
  "cat": "Narrative Short",
  "year": 2025,
  "still": "https://i.vimeocdn.com/video/2011163359-cd4c956eccd40546a9dd125bad1ace148747c804d292359dc8c00ad4b66960aa-d_1280?f=webp&region=us",
  "synopsis": "A character study told in stillness \u2014 a portrait of grief, ritual, and the objects we hold onto.",
  "pull": "Nothing can be explained twice."
 },
 {
  "slug": "runaway-sheep",
  "title": "Runaway Sheep",
  "cat": "Narrative Short",
  "year": 2025,
  "still": "https://i.vimeocdn.com/video/2014015736-0b8a182a15484b59df36ac349c0690aa712a2c05298a7d2cecb0c9f65634c191-d_1280?f=webp&region=us",
  "synopsis": "A coming-of-age story about slipping the leash and finding your own direction.",
  "pull": "Loose in the shoulders. Exact in the cut."
 },
 {
  "slug": "dbc",
  "title": "DBC",
  "cat": "Commercial",
  "year": 2024,
  "still": "https://i.vimeocdn.com/video/2021082742-6aeb97a69d7f902f34ee1c59034d738fe959f9d752db080f92786fb3a8ba3a12-d_1280?f=webp&region=us",
  "synopsis": "A visual study built around rhythm, texture, and motion.",
  "pull": "Not a lesser register."
 },
 {
  "slug": "red-hand",
  "title": "Red Hand",
  "cat": "Narrative Short",
  "year": 2025,
  "still": "https://i.vimeocdn.com/video/2068749342-896a910ee2dfd2e952182446771e713ba73b323ee827650541d9df651f7bdd0d-d_1280?f=webp&region=us",
  "synopsis": "A tense character study about guilt, complicity, and what people choose to carry.",
  "pull": "The grade is the second script."
 },
 {
  "slug": "until-i-come-alive",
  "title": "Until I Come Alive",
  "cat": "Narrative Short",
  "year": 2025,
  "still": "https://i.vimeocdn.com/video/2147567892-e6d133a1499b9de813496efb7cf34b70d2b87cf0555715937fed53ad29de7247-d_1280?f=webp&region=us",
  "synopsis": "An intimate portrait of someone chasing the one moment that makes them feel real.",
  "pull": "The schedule became the subject."
 },
 {
  "slug": "lost-puppets",
  "title": "Lost Puppets",
  "cat": "Narrative Short",
  "year": 2026,
  "still": "https://i.vimeocdn.com/video/1986746851-0686e4cf8f8532e3840e60d5c589e0a62ae6223a2b140140d32e1b26c88b24c9-d_1280?f=webp&region=us",
  "synopsis": "A tender, off-kilter story about the people we latch onto when we're lost ourselves.",
  "pull": "That half second is the whole film."
 },
 {
  "slug": "family-ties",
  "title": "Family Ties x Evo Da Saint",
  "cat": "Film",
  "year": 2025,
  "still": "https://i.vimeocdn.com/video/2141930382-a3174cac69d6363c1a7f1bedd401d6d0a02bc53793ab80ca74c498cb3f1b4399-d_1280?f=webp&region=us",
  "synopsis": "A live session capturing Evo Da Saint's sound in an intimate, unfiltered setting.",
  "pull": "It belongs to somebody else as much as to us."
 }
];

/* Placement intent only: which column band, and how much air to leave above.
   Actual pixel positions are solved at layout time, so nothing can collide. */
const COLS = 12;
const PLACE = [
  {k:'f', i:0,            c:6,  w:6, lead:0,   tc:'00:00:00:00'},
  {k:'t', id:'who',       c:0,  w:3, lead:34,  tc:'00:00:12:04'},
  {k:'f', i:1,            c:1,  w:4, lead:56,  tc:'00:01:04:11'},
  {k:'t', id:'what',      c:7,  w:4, lead:40,  tc:'00:01:22:19'},
  {k:'f', i:2,            c:7,  w:5, lead:14,  tc:'00:02:09:02'},
  {k:'t', id:'where',     c:0,  w:3, lead:38,  tc:'00:02:41:16'},
  {k:'f', i:3,            c:2,  w:4, lead:26,  tc:'00:03:00:07'},
  {k:'f', i:5,            c:7,  w:5, lead:52,  tc:'00:04:30:15'},
  {k:'t', id:'why',       c:0,  w:3, lead:44,  tc:'00:04:11:03'},
  {k:'f', i:4,            c:0,  w:4, lead:26,  tc:'00:03:48:21'},
  {k:'f', i:6,            c:4,  w:5, lead:70,  tc:'00:05:12:09'},
  {k:'t', id:'how',       c:9,  w:3, lead:58,  tc:'00:05:44:22'},
  {k:'f', i:7,            c:0,  w:4, lead:48,  tc:'00:06:03:18'},
];

const COPY = {
  who:  {l:'Who we are',   p:['Blue Sheep is an independent film company in Toronto. Founded 2023.']},
  what: {l:'What we do',   p:['Documentary, narrative and commercial work. Eight finished films and counting.']},
  where:{l:'Where we are', p:['Toronto, Canada. We shoot here and most other places.']},
  why:  {l:'Why we do it', p:['Because the small films are the ones that teach you anything.']},
  how:  {l:'How we do it', p:['Short crews, long takes, and a stubborn refusal to shoot anything twice that worked the first time.']},
};

const canvas = document.getElementById('canvas');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const nodes = PLACE.map(p=>{
  const el = document.createElement(p.k==='f' ? 'a' : 'div');
  el.className = 'item ' + (p.k==='f' ? 'film' : 'blk');
  const tc = `<div class="tc">${p.tc}</div>`;
  if(p.k==='f'){
    const f = FILMS[p.i];
    el.href = BASE + f.slug + '.html';
    el.innerHTML = tc + `
      <figure>
        <span class="idx">${String(p.i+1).padStart(2,'0')}</span>
        <img src="${esc(f.still)}" alt="${esc(f.title)}">
      </figure>
      <figcaption>
        <span class="t">${esc(f.title)}</span>
        <span class="c">${esc(f.cat)}&nbsp;&nbsp;${f.year}</span>
      </figcaption>`;
  } else {
    const c = COPY[p.id];
    el.innerHTML = tc + `<div class="lbl">${esc(c.l)}</div>`
      + c.p.map(x=>`<p>${esc(x)}</p>`).join('');
  }
  canvas.appendChild(el);
  return el;
});

function layout(){
  if (matchMedia('(max-width:860px)').matches){
    canvas.style.height='auto';
    nodes.forEach(n=>{n.style.width='';n.style.left='';n.style.top='';});
    return;
  }
  const gut = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gut'));
  const W = canvas.clientWidth;
  const colW = (W - gut*(COLS-1)) / COLS;
  const bottom = new Array(COLS).fill(0);   // occupied depth per column

  PLACE.forEach((p, n) => {
    const el = nodes[n];
    const w = colW*p.w + gut*(p.w-1);
    el.style.width = w + 'px';
    el.style.left  = (colW*p.c + gut*p.c) + 'px';

    // start below whatever already occupies these columns, plus deliberate air
    let start = 0;
    for(let c=p.c; c<p.c+p.w; c++) start = Math.max(start, bottom[c]);
    start += p.lead;
    el.style.top = start + 'px';

    const h = el.offsetHeight;
    for(let c=p.c; c<p.c+p.w; c++) bottom[c] = start + h;
  });

  canvas.style.height = Math.max(...bottom) + 'px';
}

// images change height once decoded — relayout when they land
let pending = FILMS.length;
canvas.querySelectorAll('img').forEach(img=>{
  const done = () => { if(--pending<=0) layout(); };
  img.complete ? done() : (img.onload = done, img.onerror = done);
});
layout();
addEventListener('resize', layout);
document.fonts && document.fonts.ready.then(layout);
</script>
</body>
</html>

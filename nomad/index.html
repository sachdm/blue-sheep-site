<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOMAD — Blue Sheep</title>
<meta name="description" content="NOMAD — a short screenplay by Blue Sheep.">
<link rel="canonical" href="https://sachdm.github.io/blue-sheep-site/nomad/">
<style>
:root {
  --bg: #0c0f0d;
  --bg2: #10140f;
  --fg: #c8e6c9;
  --green: #4ade80;
  --dim: #5b7360;
  --amber: #fbbf24;
  --cyan: #67e8f9;
  --red: #f87171;
  --hover: #1a221c;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: "SF Mono", "Menlo", "Monaco", "Fira Code", "Cascadia Code", monospace;
  font-size: 14px;
  line-height: 1.65;
}
body::after {
  content: "";
  position: fixed; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.10) 0px, rgba(0,0,0,0.10) 1px, transparent 1px, transparent 3px);
}

#app { display: flex; height: 100vh; }
#sidebar {
  width: 300px; min-width: 300px;
  background: var(--bg2);
  border-right: 1px solid #1e2a20;
  display: flex; flex-direction: column;
  overflow-y: auto;
}
#content {
  flex: 1; overflow-y: auto;
  padding: 28px 40px 30vh;
}
#reader { max-width: 740px; margin: 0 auto; }

#brand {
  padding: 16px 16px 12px;
  border-bottom: 1px solid #1e2a20;
}
#brand .prompt { color: var(--green); }
#brand .at { color: var(--dim); }
#brand .path { color: var(--cyan); }
#cursor {
  display: inline-block; width: 8px; height: 15px;
  background: var(--green); vertical-align: text-bottom;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
#brand .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }

#searchwrap { padding: 10px 16px; border-bottom: 1px solid #1e2a20; }
#search {
  width: 100%;
  background: var(--bg);
  border: 1px solid #223026;
  border-radius: 4px;
  color: var(--fg);
  font: inherit;
  padding: 6px 9px;
  outline: none;
}
#search:focus { border-color: var(--green); }
#search::placeholder { color: var(--dim); }

#nav { flex: 1; padding: 8px 0 24px; }
.group-label {
  padding: 14px 16px 4px;
  color: var(--amber);
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
.group-label .count { color: var(--dim); letter-spacing: 0; }
.nav-item {
  display: block;
  padding: 6px 16px 6px 22px;
  cursor: pointer;
  border-left: 2px solid transparent;
  color: var(--fg);
  text-decoration: none;
}
.nav-item:hover { background: var(--hover); }
.nav-item.active { background: var(--hover); border-left-color: var(--green); }
.nav-item .t { display: block; }
.nav-item .d { display: block; color: var(--dim); font-size: 11px; }
#empty-note { padding: 12px 16px; color: var(--dim); font-size: 12px; }

#sidebar-foot {
  padding: 12px 16px;
  border-top: 1px solid #1e2a20;
  color: var(--dim); font-size: 11px;
}
#sidebar-foot a { color: var(--cyan); text-decoration: none; display: inline-block; margin-top: 6px; }
#sidebar-foot a:first-child { margin-top: 0; }
#sidebar-foot a:hover { text-decoration: underline; }

#meta {
  color: var(--dim); font-size: 12px;
  display: flex; gap: 14px; align-items: center;
  margin-bottom: 18px; flex-wrap: wrap;
}
#meta .tag { color: var(--amber); }

.entry h1 { color: var(--green); font-size: 19px; margin: 4px 0 16px; }
.entry h2 { color: var(--amber); font-size: 15px; margin: 26px 0 8px; }
.entry h3 { color: var(--amber); font-size: 14px; margin: 18px 0 4px; }
.entry p { margin: 10px 0; }
.entry ul { list-style: none; margin: 8px 0; }
.entry ul li { margin: 4px 0; }
.entry ul li::before { content: "* "; color: var(--green); }
.entry blockquote { color: var(--dim); border-left: 2px solid var(--dim); padding-left: 12px; margin: 10px 0; font-style: italic; }
.entry code { background: var(--hover); color: var(--cyan); padding: 0 4px; border-radius: 3px; }
.entry strong { color: #fff; }
.entry em { color: var(--amber); }
.entry hr { border: none; border-top: 1px dashed var(--dim); margin: 22px 0; }
.entry a { color: var(--cyan); }

#content.page-mode { background: #33352f; overflow-x: auto; }
body:has(#content.page-mode)::after { display: none; }

/* documents (summary, two-pager, reader's report) on the same white page */
.page.doc { font-size: 13px; line-height: 1.62; }
.page.doc #meta { color: #666; margin-bottom: 22px; }
.page.doc #meta .tag { color: #8a6d00; }
.page.doc .entry h1 { color: #111; font-size: 17px; margin: 0 0 18px; letter-spacing: 1px; }
.page.doc .entry h2 { color: #111; font-size: 14px; margin: 26px 0 8px; }
.page.doc .entry h3 { color: #333; font-size: 13px; margin: 18px 0 4px; }
.page.doc .entry p { margin: 11px 0; }
.page.doc .entry strong { color: #111; font-weight: bold; }
.page.doc .entry em { color: #333; }
.page.doc .entry ul li::before { color: #111; }
.page.doc .entry blockquote { color: #444; border-left-color: #bbb; }
.page.doc .entry code { background: #eee; color: #111; }
.page.doc .entry hr { border-top: 1px dashed #bbb; margin: 24px 0; }
.page.doc .entry a { color: #14507d; }



/* --- screenplay sheets: true US-Letter proportions, 60 cols x 54 lines --- */
#content.page-mode #reader { max-width: none; }
.page-wrap {
  max-width: none;
  display: flex; flex-direction: column; align-items: center;
  gap: 30px; padding: 30px 0 60px;
}
.page {
  position: relative;
  background: #fff; color: #111;
  font-family: "Courier Prime", "Courier New", Courier, monospace;
  font-size: 15px; line-height: 15px; letter-spacing: 0;
  width: 765px; min-height: 990px;
  margin: 0;
  padding: 90px 90px 90px 135px;
  box-shadow: 0 8px 34px rgba(0,0,0,.55);
}
.page .sp-body { width: 540px; }
/* lines are pre-wrapped to exact column counts — never let the browser re-wrap */
.page .sp-body > div { white-space: pre; }
.page-num {
  position: absolute; top: 46px; right: 90px;
  font-size: 15px; line-height: 15px; color: #111;
}
.sp-blank { height: 15px; }
.page.titlepage { display: flex; align-items: center; justify-content: center; }
.titleblock { text-align: center; }
.titleblock .tp-t { text-transform: uppercase; letter-spacing: 3px; }
.titleblock .tp-by { margin-top: 45px; }
.titleblock .tp-who { margin-top: 45px; }
.titleblock .tp-note { margin-top: 45px; color: #333; }

.sp-slug { text-transform: uppercase; font-weight: bold; margin: 0; }
.sp-action { margin: 0; }
.sp-char { text-transform: uppercase; margin: 0; padding-left: 22ch; }
.sp-paren { margin: 0; padding-left: 16ch; }
.sp-dialog { margin: 0; padding-left: 10ch; }
.sp-trans { text-transform: uppercase; text-align: right; margin: 0; }
.sp-super { margin: 0; }

.sp-toolbar {
  position: sticky; top: 0; z-index: 5;
  max-width: 1060px; margin: 0 auto; padding: 10px 26px 0;
  display: flex; gap: 8px; align-items: center;
}
.sp-toolbar button {
  background: #23251f; color: var(--fg); border: 1px solid #33402f;
  border-radius: 5px; padding: 5px 11px; font: inherit; font-size: 12px; cursor: pointer;
}
.sp-toolbar button:hover { background: #2b2e26; }
.sp-toolbar::before {
  content: "NOMAD — read & comment"; color: var(--dim); font-size: 12px; margin-right: 8px;
}

#welcome { color: var(--dim); margin-top: 10vh; text-align: center; }
#welcome .big { color: var(--green); font-size: 18px; }
kbd {
  background: var(--hover); border: 1px solid #2a3a2e; border-radius: 3px;
  padding: 0 5px; font: inherit; font-size: 11px; color: var(--fg);
}

@media (max-width: 760px) {
  #app { flex-direction: column; height: auto; }
  #sidebar { width: 100%; min-width: 0; max-height: 45vh; border-right: none; border-bottom: 1px solid #1e2a20; }
  #content { padding: 20px 16px 20vh; }
  .page { width: 100%; min-height: 0; padding: 40px 22px 50px 34px; font-size: 12px; line-height: 12px; }
  .page .sp-body { width: 100%; }
  .page-num { top: 20px; right: 22px; font-size: 12px; }
  .sp-blank { height: 12px; }
}

@media print {
  #sidebar, .sp-toolbar { display: none !important; }
  #app { display: block !important; }
  #content { padding: 20px !important; }
  @page { size: letter; margin: 0.75in; }
}

</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="brand">
      <div><span class="prompt">lambo</span><span class="at">@</span><span class="path">nomad</span><span class="at">:~$</span> <span id="cursor"></span></div>
      <div class="sub">Blue Sheep — working IP</div>
    </div>
    <div id="searchwrap">
      <input id="search" placeholder="filter... ( / )" autocomplete="off" spellcheck="false">
    </div>
    <div id="nav"></div>
    <div id="sidebar-foot">
      <a href="../investors-ip.html">← back to Working IP</a><br>
      <a href="NOMAD-Master-Script.pdf" download>Script PDF ↓</a><br>
      <a href="NOMAD-Two-Pager.pdf" download>Two-pager PDF ↓</a><br>
      <a href="NOMAD-Readers-Report.pdf" download>Reader's report PDF ↓</a>
    </div>
  </div>
  <div id="content">
    <div id="reader">
      <div id="welcome">
        <div class="big">NOMAD</div>
        <div>select an entry — or press <kbd>j</kbd></div>
      </div>
    </div>
  </div>
</div>

<script>
const SCRIPT_FILE = 'script.md';
const GROUP_ORDER = ['master', 'notes'];
const GROUP_NAMES = { master: 'master script', notes: 'notes & revisions' };

let entries = [];
let current = -1;
const nav = document.getElementById('nav');
const reader = document.getElementById('reader');
const search = document.getElementById('search');

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function md(src) {
  const lines = src.split('\n');
  let html = '', inList = false;
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  for (const raw of lines) {
    const l = raw.trimEnd();
    const li = l.match(/^[-*] (.*)/);
    if (li) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { html += '</ul>'; inList = false; }
    if (/^---+$/.test(l)) { html += '<hr>'; continue; }
    const h = l.match(/^(#{1,3}) (.*)/);
    if (h) { html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }
    if (l.startsWith('> ')) { html += `<blockquote>${inline(l.slice(2))}</blockquote>`; continue; }
    if (l === '') continue;
    html += `<p>${inline(l)}</p>`;
  }
  if (inList) html += '</ul>';
  return html;
}

function slugOf(e) { return e.file.replace(/\.md$/, ''); }

// --- screenplay pagination: mirrors the PDF generator exactly ---
const SP_LINES_PER_PAGE = 54, SP_W_ACTION = 60, SP_W_DIALOG = 35, SP_W_PAREN = 28;

function spWrap(text, width) {
  const words = String(text).split(/\s+/);
  const out = [];
  let cur = '';
  for (const w of words) {
    const next = cur ? cur + ' ' + w : w;
    if (next.length > width && cur) { out.push(cur); cur = w; } else { cur = next; }
  }
  out.push(cur);
  return out.length ? out : [''];
}

function renderScreenplay(src) {
  const raw = src.split('\n');
  const isSlug = l => /^(?:##\s*)?(INT|EXT|INT\/EXT|EST)[.\s]/i.test(l.trim());
  const isTrans = l => /^(CUT TO:|CUT TO BLACK\.?|FADE (IN|OUT)|SMASH CUT|THE END)$/.test(l.trim());
  const isCue = l => {
    const t = l.trim();
    if (!t.length || t.length > 38) return false;
    if (/^(INSERT|SUPER|INT|EXT)/i.test(t)) return false;
    if (/\.$/.test(t)) return false;
    return /[A-Z]/.test(t) && t === t.toUpperCase() && /^[A-Z0-9 '().\-/&]+$/.test(t);
  };

  const atoms = [];
  let i = 0, started = false;
  while (i < raw.length) {
    const l = raw[i].trim();
    if (!l || /^---+$/.test(l) || /^#\s/.test(l) || /^\*\*(Rendered|v\d)/.test(l)) { i++; continue; }
    if (isCue(l)) {
      const rows = [['sp-char', l.toUpperCase()]];
      i++;
      while (i < raw.length && raw[i].trim()) {
        const d = raw[i].trim();
        const paren = /^\(.*\)$/.test(d);
        spWrap(d, paren ? SP_W_PAREN : SP_W_DIALOG)
          .forEach(x => rows.push([paren ? 'sp-paren' : 'sp-dialog', x]));
        i++;
      }
      atoms.push({ rows, blank: 1, kind: 'speech' });
      continue;
    }
    if (isSlug(l)) {
      const txt = l.replace(/^##\s*/, '').toUpperCase();
      atoms.push({ rows: spWrap(txt, SP_W_ACTION).map(x => ['sp-slug', x]), blank: started ? 1 : 0, kind: 'slug' });
      started = true;
    } else if (isTrans(l)) {
      atoms.push({ rows: [['sp-trans', l.toUpperCase()]], blank: 1, kind: 'trans' });
    } else if (/^(SUPER:|MAIN TITLE:)/i.test(l)) {
      atoms.push({ rows: [['sp-super', l.toUpperCase()]], blank: 1, kind: 'super' });
    } else {
      atoms.push({ rows: spWrap(l, SP_W_ACTION).map(x => ['sp-action', x]), blank: 1, kind: 'action' });
    }
    i++;
  }

  const pages = [];
  let cur = [], used = 0;
  const flush = () => { if (cur.length) { pages.push(cur.join('')); cur = []; used = 0; } };
  for (let n = 0; n < atoms.length; n++) {
    const a = atoms[n], nxt = atoms[n + 1];
    let need = a.blank + a.rows.length;
    if (a.kind === 'slug' && nxt) need += nxt.blank + Math.min(2, nxt.rows.length);
    if (used && used + need > SP_LINES_PER_PAGE) flush();
    const pad = used ? a.blank : 0;
    for (let b = 0; b < pad; b++) cur.push('<div class="sp-blank"></div>');
    a.rows.forEach(function (r) { cur.push('<div class="' + r[0] + '">' + esc(r[1]) + '</div>'); });
    used += pad + a.rows.length;
  }
  flush();
  return pages;
}

function buildSidebar(filter = '') {
  const q = filter.toLowerCase();
  nav.innerHTML = '';
  let shown = 0;
  for (const cat of GROUP_ORDER) {
    const group = entries.filter(e => (e.category || 'master') === cat)
      .filter(e => !q || e.title.toLowerCase().includes(q) || e.date.includes(q) || slugOf(e).includes(q));
    if (!group.length) continue;
    const label = document.createElement('div');
    label.className = 'group-label';
    label.innerHTML = `${GROUP_NAMES[cat] || cat} <span class="count">(${group.length})</span>`;
    nav.appendChild(label);
    for (const e of group) {
      const idx = entries.indexOf(e);
      const a = document.createElement('a');
      a.className = 'nav-item' + (idx === current ? ' active' : '');
      a.href = '#' + slugOf(e);
      a.dataset.idx = idx;
      a.innerHTML = `<span class="t">${esc(e.title)}</span><span class="d">${e.date}</span>`;
      a.addEventListener('click', ev => { ev.preventDefault(); open(idx); });
      nav.appendChild(a);
      shown++;
    }
  }
  if (!shown) nav.innerHTML = '<div id="empty-note">no matches</div>';
}

async function open(idx) {
  const e = entries[idx];
  if (!e) return;
  current = idx;
  buildSidebar(search.value);
  history.replaceState(null, '', '#' + slugOf(e));
  reader.innerHTML = '<div style="color:var(--dim)">loading…</div>';
  const contentEl = document.getElementById('content');
  contentEl.classList.remove('page-mode');
  try {
    const res = await fetch('entries/' + e.file, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();

    if (e.file === SCRIPT_FILE) {
      contentEl.classList.add('page-mode');
      const pages = renderScreenplay(text);
      const sheets = pages.map(function (pg, n) {
        return '<div class="page"><div class="sp-body">' + pg + '</div><div class="page-num">' + (n + 1) + '.</div></div>';
      }).join('');
      reader.innerHTML =
        '<div class="page-wrap">' +
        '<div class="page titlepage"><div class="titleblock"><div class="tp-t">NOMAD</div><div class="tp-by">by</div><div class="tp-who">Sacha Mitchell</div></div></div>' +
        sheets + '</div>';
      contentEl.scrollTop = 0;
    fitPages();
      return;
    }

    contentEl.classList.add('page-mode');
    reader.innerHTML = `
      <div class="page-wrap">
        <div class="page doc">
          <div class="entry">${md(text)}</div>
        </div>
      </div>`;
    contentEl.scrollTop = 0;
    fitPages();
  } catch (err) {
    reader.innerHTML = `<div style="color:var(--red)">could not load ${esc(e.file)}</div>`;
  }
}

function fitPages() {
  var c = document.getElementById('content');
  if (!c) return;
  var avail = c.clientWidth - 36;
  var k = Math.min(1, avail / 765);
  document.querySelectorAll('.page-wrap').forEach(function (w) {
    w.style.zoom = (k < 0.999) ? k : '';
  });
}
window.addEventListener('resize', fitPages);

async function loadManifest(file) {
  const raw = await fetch(file, { cache: 'no-store' }).then(r => r.json());
  const sorted = [];
  for (const cat of GROUP_ORDER) sorted.push(...raw.filter(e => (e.category || 'master') === cat));
  sorted.push(...raw.filter(e => !GROUP_ORDER.includes(e.category)));
  entries = sorted;
  buildSidebar();
}

search.addEventListener('input', () => buildSidebar(search.value));

document.addEventListener('keydown', ev => {
  if (document.activeElement === search) {
    if (ev.key === 'Escape') { search.value = ''; buildSidebar(); search.blur(); }
    return;
  }
  if (ev.key === '/') { ev.preventDefault(); search.focus(); return; }
  if (ev.key === 'j') { if (current < entries.length - 1) open(current + 1); }
  if (ev.key === 'k') { if (current > 0) open(current - 1); }
});

(async function init() {
  await loadManifest('entries.json');
  const hash = location.hash.replace('#', '');
  const idx = entries.findIndex(e => slugOf(e) === hash);
  open(idx >= 0 ? idx : 0);
})();
</script>
</body>
</html>

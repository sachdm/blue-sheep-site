<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOMAD — Blue Sheep</title>
<meta name="description" content="NOMAD — a short screenplay by Blue Sheep.">
<link rel="canonical" href="https://sachdm.github.io/blue-sheep-site/nomad/">
<style>
:root {
  --bg: #0c0f0d;
  --bg2: #10140f;
  --fg: #c8e6c9;
  --green: #4ade80;
  --dim: #5b7360;
  --amber: #fbbf24;
  --cyan: #67e8f9;
  --red: #f87171;
  --hover: #1a221c;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: "SF Mono", "Menlo", "Monaco", "Fira Code", "Cascadia Code", monospace;
  font-size: 14px;
  line-height: 1.65;
}
body::after {
  content: "";
  position: fixed; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.10) 0px, rgba(0,0,0,0.10) 1px, transparent 1px, transparent 3px);
}

#app { display: flex; height: 100vh; }
#sidebar {
  width: 300px; min-width: 300px;
  background: var(--bg2);
  border-right: 1px solid #1e2a20;
  display: flex; flex-direction: column;
  overflow-y: auto;
}
#content {
  flex: 1; overflow-y: auto;
  padding: 28px 40px 30vh;
}
#reader { max-width: 740px; margin: 0 auto; }

#brand {
  padding: 16px 16px 12px;
  border-bottom: 1px solid #1e2a20;
}
#brand .prompt { color: var(--green); }
#brand .at { color: var(--dim); }
#brand .path { color: var(--cyan); }
#cursor {
  display: inline-block; width: 8px; height: 15px;
  background: var(--green); vertical-align: text-bottom;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
#brand .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }

#searchwrap { padding: 10px 16px; border-bottom: 1px solid #1e2a20; }
#search {
  width: 100%;
  background: var(--bg);
  border: 1px solid #223026;
  border-radius: 4px;
  color: var(--fg);
  font: inherit;
  padding: 6px 9px;
  outline: none;
}
#search:focus { border-color: var(--green); }
#search::placeholder { color: var(--dim); }

#nav { flex: 1; padding: 8px 0 24px; }
.group-label {
  padding: 14px 16px 4px;
  color: var(--amber);
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
.group-label .count { color: var(--dim); letter-spacing: 0; }
.nav-item {
  display: block;
  padding: 6px 16px 6px 22px;
  cursor: pointer;
  border-left: 2px solid transparent;
  color: var(--fg);
  text-decoration: none;
}
.nav-item:hover { background: var(--hover); }
.nav-item.active { background: var(--hover); border-left-color: var(--green); }
.nav-item .t { display: block; }
.nav-item .d { display: block; color: var(--dim); font-size: 11px; }
#empty-note { padding: 12px 16px; color: var(--dim); font-size: 12px; }

#sidebar-foot {
  padding: 12px 16px;
  border-top: 1px solid #1e2a20;
  color: var(--dim); font-size: 11px;
}
#sidebar-foot a { color: var(--cyan); text-decoration: none; }
#sidebar-foot a:hover { text-decoration: underline; }

#meta {
  color: var(--dim); font-size: 12px;
  display: flex; gap: 14px; align-items: center;
  margin-bottom: 18px; flex-wrap: wrap;
}
#meta .tag { color: var(--amber); }

.entry h1 { color: var(--green); font-size: 19px; margin: 4px 0 16px; }
.entry h2 { color: var(--amber); font-size: 15px; margin: 26px 0 8px; }
.entry h3 { color: var(--amber); font-size: 14px; margin: 18px 0 4px; }
.entry p { margin: 10px 0; }
.entry ul { list-style: none; margin: 8px 0; }
.entry ul li { margin: 4px 0; }
.entry ul li::before { content: "* "; color: var(--green); }
.entry blockquote { color: var(--dim); border-left: 2px solid var(--dim); padding-left: 12px; margin: 10px 0; font-style: italic; }
.entry code { background: var(--hover); color: var(--cyan); padding: 0 4px; border-radius: 3px; }
.entry strong { color: #fff; }
.entry em { color: var(--amber); }
.entry hr { border: none; border-top: 1px dashed var(--dim); margin: 22px 0; }
.entry a { color: var(--cyan); }

#content.page-mode { background: #33352f; }
body:has(#content.page-mode)::after { display: none; }

.page-wrap { position: relative; max-width: 1060px; margin: 0 auto; }
.page {
  background: #fff; color: #111;
  font-family: "Courier Prime", "Courier New", Courier, monospace;
  font-size: 13.5px; line-height: 1.5;
  width: 640px; margin: 26px 0 26px 26px;
  padding: 76px 84px 92px;
  box-shadow: 0 6px 30px rgba(0,0,0,.5);
}
.page .titlepage {
  min-height: 780px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; position: relative;
}
.page .titlepage .logo { width: 90px; height: auto; margin-bottom: 46px; }
.page .titlepage .t { font-size: 24px; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 40px; }
.page .titlepage .by { margin: 3px 0; color: #333; }
.page .titlepage .contact { position: absolute; bottom: 8px; right: 0; font-size: 12px; color: #333; text-align: right; line-height: 1.5; }
.page .titlepage + .sp-body { margin-top: 40px; }

.sp-slug { text-transform: uppercase; font-weight: bold; margin: 26px 0 12px; }
.sp-slug.first { margin-top: 0; }
.sp-action { margin: 0 0 12px; }
.sp-char { text-transform: uppercase; margin: 12px 0 0; padding-left: 21ch; }
.sp-paren { margin: 0; padding-left: 15ch; max-width: 30ch; color: #222; }
.sp-dialog { margin: 0; padding-left: 10ch; max-width: 45ch; }
.sp-trans { text-transform: uppercase; text-align: right; margin: 14px 0; }
.sp-center { text-align: center; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; margin: 34px 0 18px; }
.sp-super { margin: 0 0 12px; }

.sp-toolbar {
  position: sticky; top: 0; z-index: 5;
  max-width: 1060px; margin: 0 auto; padding: 10px 26px 0;
  display: flex; gap: 8px; align-items: center;
}
.sp-toolbar button {
  background: #23251f; color: var(--fg); border: 1px solid #33402f;
  border-radius: 5px; padding: 5px 11px; font: inherit; font-size: 12px; cursor: pointer;
}
.sp-toolbar button:hover { background: #2b2e26; }
.sp-toolbar::before {
  content: "NOMAD — read & comment"; color: var(--dim); font-size: 12px; margin-right: 8px;
}

#welcome { color: var(--dim); margin-top: 10vh; text-align: center; }
#welcome .big { color: var(--green); font-size: 18px; }
kbd {
  background: var(--hover); border: 1px solid #2a3a2e; border-radius: 3px;
  padding: 0 5px; font: inherit; font-size: 11px; color: var(--fg);
}

@media (max-width: 760px) {
  #app { flex-direction: column; height: auto; }
  #sidebar { width: 100%; min-width: 0; max-height: 45vh; border-right: none; border-bottom: 1px solid #1e2a20; }
  #content { padding: 20px 16px 20vh; }
  .page { width: auto; max-width: 100%; margin: 12px 0; padding: 40px 26px 60px; }
  .page .sp-char { padding-left: 40%; }
  .page .sp-dialog { padding-left: 14%; }
  .page .sp-paren { padding-left: 28%; }
}

.sp-toolbar { background: #33352f; }

@media print {
  #sidebar, .sp-toolbar { display: none !important; }
  body::after { display: none !important; }
  html, body { height: auto; background: #fff !important; }
  #app { display: block; height: auto; }
  #content { padding: 0 !important; background: #fff !important; overflow: visible !important; }
  #content.page-mode { background: #fff !important; }
  .page-wrap { max-width: none; margin: 0; }
  .page {
    box-shadow: none !important; width: auto !important; max-width: none !important;
    margin: 0 !important; padding: 0 !important; background: #fff !important; color: #000 !important;
  }
  .page .titlepage { min-height: 90vh; page-break-after: always; }
  .sp-slug { page-break-after: avoid; }
  .sp-char { page-break-after: avoid; page-break-inside: avoid; }
  .sp-paren, .sp-dialog { page-break-before: avoid; }
  @page { size: letter; margin: 1in 1in 1in 1.5in; }
}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="brand">
      <div><span class="prompt">lambo</span><span class="at">@</span><span class="path">nomad</span><span class="at">:~$</span> <span id="cursor"></span></div>
      <div class="sub">Blue Sheep — working IP</div>
    </div>
    <div id="searchwrap">
      <input id="search" placeholder="filter... ( / )" autocomplete="off" spellcheck="false">
    </div>
    <div id="nav"></div>
    <div id="sidebar-foot">
      <a href="../investors-ip.html">← back to Working IP</a>
    </div>
  </div>
  <div id="content">
    <div id="reader">
      <div id="welcome">
        <div class="big">NOMAD</div>
        <div>select an entry — or press <kbd>j</kbd></div>
      </div>
    </div>
  </div>
</div>

<script>
const SCRIPT_FILE = 'script.md';
const GROUP_ORDER = ['master'];
const GROUP_NAMES = { master: 'master script' };

let entries = [];
let current = -1;
const nav = document.getElementById('nav');
const reader = document.getElementById('reader');
const search = document.getElementById('search');

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function md(src) {
  const lines = src.split('\n');
  let html = '', inList = false;
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  for (const raw of lines) {
    const l = raw.trimEnd();
    const li = l.match(/^[-*] (.*)/);
    if (li) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { html += '</ul>'; inList = false; }
    if (/^---+$/.test(l)) { html += '<hr>'; continue; }
    const h = l.match(/^(#{1,3}) (.*)/);
    if (h) { html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }
    if (l.startsWith('> ')) { html += `<blockquote>${inline(l.slice(2))}</blockquote>`; continue; }
    if (l === '') continue;
    html += `<p>${inline(l)}</p>`;
  }
  if (inList) html += '</ul>';
  return html;
}

function slugOf(e) { return e.file.replace(/\.md$/, ''); }

function renderScreenplay(src) {
  const rawLines = src.split('\n');
  const lines = [];
  for (const raw of rawLines) {
    const t = raw.trim();
    if (/^#\s+NOMAD/.test(t)) continue;
    if (/^\*\*Rendered/.test(t)) continue;
    lines.push(raw);
  }

  const isSlug = l => /^(?:##\s*)?(INT|EXT|INT\/EXT|EST)[.\s]/i.test(l.trim());
  const isTrans = l => /^(CUT TO:|CUT TO BLACK\.?|FADE (IN|OUT)|SMASH CUT|THE END)$/.test(l.trim());
  const isCue = l => {
    const t = l.trim();
    if (t.length === 0 || t.length > 38) return false;
    if (/^(INSERT|SUPER|INT|EXT)/i.test(t)) return false;
    return /[A-Z]/.test(t) && t === t.toUpperCase() && /^[A-Z0-9 '().\-/&]+$/.test(t);
  };

  let html = '', firstSlug = true, i = 0;
  while (i < lines.length) {
    let l = lines[i].trim();
    if (l === '' || /^---+$/.test(l)) { i++; continue; }

    if (/^WORLD:/i.test(l)) { i++; continue; }

    const hh = l.match(/^##\s+(.*)/);
    if (hh && !isSlug(l)) { html += `<div class="sp-center">${esc(hh[1])}</div>`; i++; continue; }

    if (isSlug(l)) {
      const txt = l.replace(/^##\s*/, '');
      html += `<div class="sp-slug${firstSlug ? ' first' : ''}">${esc(txt)}</div>`;
      firstSlug = false; i++; continue;
    }
    if (isTrans(l)) { html += `<div class="sp-trans">${esc(l)}</div>`; i++; continue; }
    if (/^SUPER:/i.test(l)) { html += `<div class="sp-super">${esc(l)}</div>`; i++; continue; }

    if (isCue(l)) {
      html += `<div class="sp-char">${esc(l)}</div>`;
      i++;
      while (i < lines.length && lines[i].trim() !== '') {
        const d = lines[i].trim();
        if (/^\(.*\)$/.test(d)) html += `<div class="sp-paren">${esc(d)}</div>`;
        else html += `<div class="sp-dialog">${esc(d)}</div>`;
        i++;
      }
      continue;
    }

    html += `<div class="sp-action">${esc(l)}</div>`;
    i++;
  }
  return html;
}

function buildSidebar(filter = '') {
  const q = filter.toLowerCase();
  nav.innerHTML = '';
  let shown = 0;
  for (const cat of GROUP_ORDER) {
    const group = entries.filter(e => (e.category || 'master') === cat)
      .filter(e => !q || e.title.toLowerCase().includes(q) || e.date.includes(q) || slugOf(e).includes(q));
    if (!group.length) continue;
    const label = document.createElement('div');
    label.className = 'group-label';
    label.innerHTML = `${GROUP_NAMES[cat] || cat} <span class="count">(${group.length})</span>`;
    nav.appendChild(label);
    for (const e of group) {
      const idx = entries.indexOf(e);
      const a = document.createElement('a');
      a.className = 'nav-item' + (idx === current ? ' active' : '');
      a.href = '#' + slugOf(e);
      a.dataset.idx = idx;
      a.innerHTML = `<span class="t">${esc(e.title)}</span><span class="d">${e.date}</span>`;
      a.addEventListener('click', ev => { ev.preventDefault(); open(idx); });
      nav.appendChild(a);
      shown++;
    }
  }
  if (!shown) nav.innerHTML = '<div id="empty-note">no matches</div>';
}

async function open(idx) {
  const e = entries[idx];
  if (!e) return;
  current = idx;
  buildSidebar(search.value);
  history.replaceState(null, '', '#' + slugOf(e));
  reader.innerHTML = '<div style="color:var(--dim)">loading…</div>';
  const contentEl = document.getElementById('content');
  contentEl.classList.remove('page-mode');
  try {
    const res = await fetch('entries/' + e.file, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();

    if (e.file === SCRIPT_FILE) {
      contentEl.classList.add('page-mode');
      const html = renderScreenplay(text);
      reader.innerHTML = `
        <div class="sp-toolbar"></div>
        <div class="page-wrap">
          <div class="page">
            <div class="titlepage">
              <img class="logo" src="../small-sheep.png" alt="Blue Sheep">
              <div class="t">NOMAD</div>
              <div class="by">written by Lambo &amp; Sacha Mitchell</div>
              <div class="contact">Blue Sheep<br>info@bluesheepfilms.com</div>
            </div>
            <div class="sp-body">${html}</div>
          </div>
        </div>`;
      contentEl.scrollTop = 0;
      return;
    }

    reader.innerHTML = `
      <div id="meta">
        <span>${e.date}</span>
        <span class="tag">[${esc(e.category || 'master')}]</span>
      </div>
      <div class="entry">${md(text)}</div>`;
    contentEl.scrollTop = 0;
  } catch (err) {
    reader.innerHTML = `<div style="color:var(--red)">could not load ${esc(e.file)}</div>`;
  }
}

async function loadManifest(file) {
  const raw = await fetch(file, { cache: 'no-store' }).then(r => r.json());
  const sorted = [];
  for (const cat of GROUP_ORDER) sorted.push(...raw.filter(e => (e.category || 'master') === cat));
  sorted.push(...raw.filter(e => !GROUP_ORDER.includes(e.category)));
  entries = sorted;
  buildSidebar();
}

search.addEventListener('input', () => buildSidebar(search.value));

document.addEventListener('keydown', ev => {
  if (document.activeElement === search) {
    if (ev.key === 'Escape') { search.value = ''; buildSidebar(); search.blur(); }
    return;
  }
  if (ev.key === '/') { ev.preventDefault(); search.focus(); return; }
  if (ev.key === 'j') { if (current < entries.length - 1) open(current + 1); }
  if (ev.key === 'k') { if (current > 0) open(current - 1); }
});

(async function init() {
  await loadManifest('entries.json');
  const hash = location.hash.replace('#', '');
  const idx = entries.findIndex(e => slugOf(e) === hash);
  open(idx >= 0 ? idx : 0);
})();
</script>
</body>
</html>

    <a class="brand" href="index.html" aria-label="Blue Sheep — Home"><img class="brand-logo" src="small-sheep.png" alt="Blue Sheep" width="309" height="240"><span class="brand-word">Blue<em>·</em>Sheep</span></a>

<main id="main" class="wrap page-main">

  <h1 class="label reveal inv-h1">Slate</h1>

  <div class="inv-hub" id="invHub">
    <p class="inv-hub-intro reveal">The active development slate.</p>

    <div class="inv-hub-grid">
      <a class="inv-hub-card reveal" href="investors-ip.html">
        <span class="inv-hub-label-row"><span class="inv-hub-label">Working IP</span><span class="inv-hub-badge">Internal</span></span>

</main>

<footer>

  <span class="clock" id="clock">Toronto</span>
  <div class="socials">
    <a href="https://vimeo.com/bluesheepfilms" target="_blank" rel="noopener noreferrer" aria-label="Blue Sheep on Vimeo">Vimeo</a>

</footer>

<script>
  (function() {
    var path = location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.nav-links a').forEach(function(a) {
      var raw = a.getAttribute('href') || '';
      if (raw.charAt(0) === '#') return;
      var href = raw.split('#')[0] || 'index.html';
      if (href === path) a.setAttribute('aria-current', 'page');
    });
  })();

  // Clicking the logo/home link should return to a calm homepage, not
  // replay the intro animation — flag it so index.html knows to skip it.
  document.querySelectorAll('a.brand').forEach(function(a) {
    a.addEventListener('click', function() {
      try { sessionStorage.setItem('bs_skip_intro', '1'); } catch (e) {}
    });
  });

  const toggle = document.querySelector('.nav-toggle');
  const linkGroup = document.querySelector('.nav-links');
  toggle.addEventListener('click', () => {
    const isOpen = linkGroup.classList.toggle('open');
    toggle.textContent = isOpen ? 'Close' : 'Menu';
    toggle.setAttribute('aria-expanded', String(isOpen));
    document.documentElement.style.overflow = isOpen ? 'hidden' : '';
    if (isOpen) {
      const firstLink = linkGroup.querySelector('a');
      if (firstLink) firstLink.focus();
    } else {
      toggle.focus();
    }
  });
  linkGroup.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && linkGroup.classList.contains('open')) {
      linkGroup.classList.remove('open');
      toggle.textContent = 'Menu';
      toggle.setAttribute('aria-expanded', 'false');
      document.documentElement.style.overflow = '';
      toggle.focus();
    }
  });

  const revealEls = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  revealEls.forEach(el => observer.observe(el));

  const progressBar = document.querySelector('.progress-bar');
  function updateProgress() {
    const h = document.documentElement;
    const scrollable = h.scrollHeight - h.clientHeight;
    const pct = scrollable > 0 ? (h.scrollTop / scrollable) * 100 : 0;
    progressBar.style.width = pct + '%';
  }
  window.addEventListener('scroll', updateProgress, { passive: true });
  updateProgress();

  const clockEl = document.getElementById('clock');
  if (clockEl) {
    const fmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Toronto', hour: 'numeric', minute: '2-digit', hour12: true });
    function updateClock() {
      clockEl.textContent = 'Toronto — ' + fmt.format(new Date());
    }
    updateClock();
    setInterval(updateClock, 30000);
  }

  (function() {
    const hub = document.getElementById('invHub');

  })();
</script>

</body>
</html>

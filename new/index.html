<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Sheep</title>
<meta name="description" content="Blue Sheep — an independent film production company based in Toronto.">
<meta name="theme-color" content="#ffffff">
<link rel="canonical" href="https://sachdm.github.io/blue-sheep-site/new/">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23fffff0'/%3E%3Cellipse cx='50' cy='54' rx='30' ry='20' fill='%23101010'/%3E%3C/svg%3E">

<style>
:root{
  --paper:#ffffff;
  --ink:#101010;
  --mute:#8b8b82;
  --rule:#e9e9e2;
  --indigo:#4050a0;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  flex-direction:column;
}
a{color:inherit}
.shell{width:100%;max-width:1180px;margin:0 auto;padding:0 40px}

/* ---- masthead ---- */
.top{padding-top:46px}
.mast{
  font-size:15px;
  font-weight:700;
  letter-spacing:.2em;
  text-transform:uppercase;
}
.mast i{color:var(--indigo);font-style:normal;padding:0 .1em}

/* ---- the artwork ----
   Shown whole, at its own aspect ratio. Not cropped, not tiled, not moving —
   this flock bleeds off all four edges of the card, so any band cut through
   it slices animals in half. Presented as the object it is instead. */
.art{
  margin-top:clamp(36px,9vh,96px);
  display:block;
  width:100%;
  max-width:560px;
  height:auto;
  aspect-ratio:700 / 381;
}

/* ---- foot ---- */
.foot{margin-top:auto;padding-top:44px;padding-bottom:38px}
.kicker{
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--mute);
  padding-bottom:16px;
}
.row{
  border-top:1px solid var(--rule);
  padding-top:18px;
  display:flex;
  flex-wrap:wrap;
  align-items:baseline;
  gap:8px 30px;
}
.mail{
  font-size:clamp(1.05rem,2.4vw,1.45rem);
  font-weight:500;
  letter-spacing:-.02em;
  text-decoration:none;
  border-bottom:1.5px solid var(--indigo);
  padding-bottom:2px;
  transition:color .18s ease;
}
.mail:hover{color:var(--indigo)}
.elsewhere{margin-left:auto;display:flex;gap:20px}
.elsewhere a{
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--mute);
  text-decoration:none;
  transition:color .18s ease;
}
.elsewhere a:hover{color:var(--ink)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

@media(max-width:640px){
  .shell{padding:0 22px}
  .top{padding-top:30px}
  .art{margin-top:clamp(26px,6vh,52px);max-width:100%}
  .foot{padding-top:32px;padding-bottom:28px}
  .elsewhere{margin-left:0;width:100%;padding-top:6px}
}
@media(prefers-reduced-motion:reduce){
  .mail,.elsewhere a{transition:none}
}
</style>
</head>

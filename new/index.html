/* soft cream scrims so the type stays readable over the flock */
.stage::before,
.stage::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  pointer-events:none;
}
.stage::before{
  top:0;
  height:34vh;
  background:linear-gradient(to bottom,rgba(255,255,240,.96) 0%,rgba(255,255,240,.72) 42%,rgba(255,255,240,0) 100%);
}
.stage::after{
  bottom:0;
  height:38vh;
  background:linear-gradient(to top,rgba(255,255,240,.96) 0%,rgba(255,255,240,.72) 42%,rgba(255,255,240,0) 100%);
}

/* ---- the type, over the top ---- */
.ui{
  position:relative;
  z-index:1;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  max-width:1180px;
  margin:0 auto;
  padding:46px 40px 40px;
}
.mast{
  font-size:15px;
  font-weight:700;
  letter-spacing:.2em;
  text-transform:uppercase;
}
.mast i{color:var(--indigo);font-style:normal;padding:0 .1em}

.foot .kicker{
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--mute);
  padding-bottom:14px;
}
.row{
  display:flex;
  flex-wrap:wrap;
  align-items:baseline;
  gap:8px 30px;
}
.mail{
  font-size:clamp(1.15rem,3vw,1.9rem);
  font-weight:600;
  letter-spacing:-.025em;
  text-decoration:none;
  border-bottom:2px solid var(--indigo);
  padding-bottom:2px;
  transition:color .18s ease;
}
.mail:hover{color:var(--indigo)}
.elsewhere{margin-left:auto;display:flex;gap:20px}
.elsewhere a{
  font-size:12px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--mute);
  text-decoration:none;
  transition:color .18s ease;
}
.elsewhere a:hover{color:var(--ink)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

@media(max-width:640px){
  .ui{padding:30px 22px 28px}
  .stage::before{height:26vh}
  .stage::after{height:34vh}
  .elsewhere{margin-left:0;width:100%;padding-top:6px}
}
@media(prefers-reduced-motion:reduce){
  .mail,.elsewhere a{transition:none}
}
</style>

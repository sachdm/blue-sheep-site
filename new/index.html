/* ---- foot ---- */
.foot{padding-top:26px;padding-bottom:38px}
.kicker{
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--mute);
  padding-bottom:16px;
}
.row{
  border-top:1px solid var(--rule);
  padding-top:18px;
  display:flex;
  flex-wrap:wrap;
  align-items:baseline;
  gap:8px 30px;
}
.mail{
  font-size:clamp(1.05rem,2.4vw,1.45rem);
  font-weight:500;
  letter-spacing:-.02em;
  text-decoration:none;
  border-bottom:1.5px solid var(--indigo);
  padding-bottom:2px;
  transition:color .18s ease;
}
.mail:hover{color:var(--indigo)}
.elsewhere{margin-left:auto;display:flex;gap:20px}
.elsewhere a{
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--mute);
  text-decoration:none;
  transition:color .18s ease;
}
.elsewhere a:hover{color:var(--ink)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

@media(max-width:640px){
  .shell{padding:0 22px}
  .top{padding-top:30px}
  .flock{
    background-size:130px auto;
    animation-name:marchM;
    min-height:clamp(150px,26vh,286px);
    margin-top:clamp(22px,5vh,40px);
  }
  .foot{padding-bottom:28px}
  .elsewhere{margin-left:0;width:100%;padding-top:6px}
}
@media(prefers-reduced-motion:reduce){
  .flock{animation:none}
  .mail,.elsewhere a{transition:none}
}

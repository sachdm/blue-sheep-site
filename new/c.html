<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Sheep</title>
<meta name="description" content="Blue Sheep — an independent film production company in Toronto.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23fffff0'/%3E%3Ccircle cx='50' cy='50' r='26' fill='%23c04030'/%3E%3C/svg%3E">
<link rel="preload" href="../fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{
  --paper:#ffffff;
  --cream:#fffff0;
  --ink:#101010;
  --mute:#7c7c70;
  --red:#c04030;
  --olive:#a0a030;
  --sky:#7090c0;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  flex-direction:column;
}
a{color:inherit}

/* thin colour bar — the card's palette, stated once */
.bar{display:flex;height:5px;flex:0 0 auto}
.bar i{flex:1}
.bar i:nth-child(1){background:var(--red)}
.bar i:nth-child(2){background:var(--olive)}
.bar i:nth-child(3){background:var(--sky)}
.bar i:nth-child(4){background:var(--cream)}

.shell{
  flex:1;
  width:100%;
  max-width:960px;
  margin:0 auto;
  padding:40px 38px 34px;
  display:flex;
  flex-direction:column;
}

.mast{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:16px;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--mute);
}
.mast .no{color:var(--red)}

.core{
  flex:1;
  display:flex;
  align-items:center;
  gap:clamp(24px,6vw,64px);
  padding:9vh 0 8vh;
}
.core .lamb{
  flex:0 0 auto;
  width:clamp(96px,17vw,190px);
  height:auto;
  display:block;
  /* recolour the blue lamb to the card's red */
  filter:brightness(0) saturate(100%) invert(31%) sepia(48%) saturate(2100%) hue-rotate(342deg) brightness(88%) contrast(92%);
}
.words{min-width:0}
.line{
  font-family:'Fraunces','Iowan Old Style',Georgia,serif;
  font-weight:400;
  font-size:clamp(2rem,5.4vw,3.9rem);
  line-height:1.05;
  letter-spacing:-.022em;
  max-width:18ch;
}
.line em{font-style:italic;color:var(--red)}
.kicker{
  margin-top:22px;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--mute);
}

.foot{
  border-top:1px dashed #dcdcd2;
  padding-top:18px;
  display:flex;
  flex-wrap:wrap;
  align-items:baseline;
  gap:6px 26px;
  font-size:13px;
}
.mail{
  font-weight:500;
  text-decoration:none;
  color:var(--ink);
  border-bottom:1.5px solid var(--red);
  padding-bottom:1px;
  transition:color .18s ease;
}
.mail:hover{color:var(--red)}
.elsewhere{margin-left:auto;display:flex;gap:18px}
.elsewhere a{
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--mute);
  text-decoration:none;
  transition:color .18s ease;
}
.elsewhere a:hover{color:var(--ink)}

@media(max-width:640px){
  .shell{padding:26px 20px 24px}
  .core{flex-direction:column;align-items:flex-start;padding:6vh 0 5vh;gap:26px}
  .line{max-width:none}
  .elsewhere{margin-left:0;width:100%;padding-top:4px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="bar" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<div class="shell">

  <header class="mast">
    <span>Blue Sheep <span class="no">/</span> Film</span>
    <span>Toronto</span>
  </header>

  <main class="core">
    <img class="lamb" src="../small-sheep.png" alt="Blue Sheep" width="309" height="240">
    <div class="words">
      <h1 class="line">We make films the <em>slow</em> way.</h1>
      <p class="kicker">Est. 2023 — Toronto, Canada</p>
    </div>
  </main>

  <footer class="foot">
    <a class="mail" href="mailto:info@bluesheepfilms.com">info@bluesheepfilms.com</a>
    <nav class="elsewhere">
      <a href="https://vimeo.com/bluesheepfilms" target="_blank" rel="noopener noreferrer">Vimeo</a>
      <a href="https://www.instagram.com/bluesheep.films/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </nav>
  </footer>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Sheep</title>
<meta name="description" content="Blue Sheep — an independent film production company in Toronto.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ffffff'/%3E%3Ccircle cx='50' cy='50' r='26' fill='%23131df1'/%3E%3C/svg%3E">
<link rel="preload" href="../fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{
  --paper:#ffffff;
  --ink:#0d0d0f;
  --mute:#8a8a92;
  --rule:#e8e8ea;
  --blue:#131df1;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-weight:400;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  flex-direction:column;
}
a{color:inherit}

.shell{
  flex:1;
  width:100%;
  max-width:1180px;
  margin:0 auto;
  padding:44px 40px 40px;
  display:flex;
  flex-direction:column;
}

/* ---- masthead ---- */
.mast{display:flex;align-items:center;gap:14px}
.mast img{width:46px;height:auto;display:block}
.mast .word{
  font-size:15px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.mast .word i{color:var(--blue);font-style:normal;padding:0 .1em}

/* ---- the statement ---- */
.core{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:12vh 0 10vh;
}
.line{
  font-size:clamp(2.6rem,8.5vw,6.4rem);
  font-weight:200;
  line-height:.98;
  letter-spacing:-.035em;
  max-width:13ch;
}
.line b{font-weight:600}
.line em{font-style:normal;color:var(--blue)}

.kicker{
  margin-top:34px;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--mute);
  max-width:none;
  white-space:nowrap;
}

/* ---- foot ---- */
.foot{
  border-top:1px solid var(--rule);
  padding-top:20px;
  display:flex;
  flex-wrap:wrap;
  align-items:baseline;
  gap:8px 30px;
}
.mail{
  font-size:clamp(1.05rem,2.6vw,1.5rem);
  font-weight:500;
  letter-spacing:-.02em;
  text-decoration:none;
  border-bottom:1.5px solid var(--blue);
  padding-bottom:1px;
  transition:color .18s ease;
}
.mail:hover{color:var(--blue)}
.elsewhere{margin-left:auto;display:flex;gap:20px}
.elsewhere a{
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--mute);
  text-decoration:none;
  transition:color .18s ease;
}
.elsewhere a:hover{color:var(--ink)}

@media(max-width:640px){
  .shell{padding:28px 22px 26px}
  .core{padding:8vh 0 7vh;max-width:none}
  .kicker{white-space:normal}
  .elsewhere{margin-left:0;width:100%;padding-top:4px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="shell">

  <header class="mast">
    <img src="../small-sheep.png" alt="" width="309" height="240">
    <span class="word">Blue<i>·</i>Sheep</span>
  </header>

  <main class="core">
    <h1 class="line">We make films the <em>slow</em> way.</h1>
    <p class="kicker">Est. 2023 — Toronto, Canada</p>
  </main>

  <footer class="foot">
    <a class="mail" href="mailto:info@bluesheepfilms.com">info@bluesheepfilms.com</a>
    <nav class="elsewhere">
      <a href="https://vimeo.com/bluesheepfilms" target="_blank" rel="noopener noreferrer">Vimeo</a>
      <a href="https://www.instagram.com/bluesheep.films/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </nav>
  </footer>

</div>

</body>
</html>

# Publish the site to GitHub Pages.
#
# This repository holds plain static HTML — no build step, nothing to compile.
# The workflow exists only because the Pages source is set to "GitHub Actions";
# it uploads the repository as-is and publishes it.
#
# .nojekyll at the root stops Pages running Jekyll over the tree.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check — the homepage must exist and be non-empty
        run: test -s index.html || (echo "index.html missing or empty" && exit 1)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
